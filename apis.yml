name: Yield Protocol
description: >-
  Yield Protocol was a decentralized Ethereum protocol that brought fixed-rate,
  fixed-term borrowing and lending to DeFi via collateralized debt vaults and its
  YieldSpace automated market maker for fyTokens (fixed-yield tokens). Backed by
  Paradigm, the protocol reached a v2 implementation before winding down, and the
  yieldprotocol.com site now displays a closure notice. There is no REST/HTTP API
  surface; Yield Protocol is consumed on-chain through its Solidity smart contracts,
  with first-party developer libraries (vaults, interfaces, YieldSpace AMM, utility
  contracts) published to npm under the official @yield-protocol scope and source
  code maintained across the github.com/yieldprotocol organization. This profile was
  surfaced as a Paradigm portfolio company and enriched from public package and
  repository evidence.
